<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algebra Quiz 3 (Google Forms style)</title>
<style>
  body { margin: 0; background: #f0ebf8; font: 14px/1.5 Roboto, Arial, sans-serif; color: #202124; }
  .RH5hzf { max-width: 640px; margin: 12px auto 0; padding-bottom: 200px; }
  .card { background: #fff; border: 1px solid #dadce0; border-radius: 8px; margin-bottom: 12px; padding: 24px; }
  .head { border-top: 10px solid #673ab7; }
  .F9yp7e { font-size: 32px; line-height: 1.25; margin: 0 0 12px; }
  .cBGGJ { color: #202124; }
  .md0UAd { color: #d93025; font-size: 14px; border-top: 1px solid #dadce0; margin-top: 16px; padding-top: 12px; }
  .M7eMe { font-size: 16px; letter-spacing: 0.1px; line-height: 24px; }
  .vnumgf { color: #d93025; padding-left: 4px; }
  .SG0AAe { display: flex; flex-direction: column; gap: 4px; margin-top: 16px; }
  .docssharedWizToggleLabeledContainer { display: flex; align-items: center; gap: 12px; min-height: 40px; cursor: pointer; }
  .Od2TWd { width: 20px; height: 20px; border: 2px solid #5f6368; border-radius: 50%; flex: none; box-sizing: border-box; }
  .aDTYNe { font-size: 14px; }
  .short { border: 0; border-bottom: 1px solid #dadce0; font: inherit; width: 50%; padding: 8px 0; margin-top: 16px; }
  .submit { background: #673ab7; color: #fff; border: 0; border-radius: 4px; padding: 10px 24px; font: 500 14px Roboto, Arial, sans-serif; }
</style>
</head>
<body>
<div class="RH5hzf" role="list">
  <div class="card head">
    <div class="F9yp7e" role="heading" aria-level="1">Algebra Quiz 3</div>
    <div class="cBGGJ">Linear equations and factoring. You have 20 minutes. Show your work on paper.</div>
    <div class="md0UAd">* Indicates required question</div>
  </div>

  <div role="listitem" class="Qr7Oae card">
    <div jsmodel="CP1oW" data-params="%.@.[1000001,&quot;Solve for x&quot;]">
      <div class="z12JJ"><div class="M4DNQ"><div role="heading" aria-level="3" class="HoXoMd D1wxyf RjsPE"><span class="M7eMe">Solve for x: 4x - 7 = 2x + 9</span><span class="vnumgf" aria-label="Required question">*</span></div></div></div>
      <div role="radiogroup" class="SG0AAe" aria-labelledby="i1">
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="x = 8"></div><span dir="auto" class="aDTYNe">x = 8</span></label>
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="x = 1"></div><span dir="auto" class="aDTYNe">x = 1</span></label>
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="x = -8"></div><span dir="auto" class="aDTYNe">x = -8</span></label>
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="x = 16"></div><span dir="auto" class="aDTYNe">x = 16</span></label>
      </div>
    </div>
  </div>

  <div role="listitem" class="Qr7Oae card">
    <div jsmodel="CP1oW" data-params="%.@.[1000002,&quot;Factor&quot;]">
      <div class="z12JJ"><div class="M4DNQ"><div role="heading" aria-level="3" class="HoXoMd D1wxyf RjsPE"><span class="M7eMe">Which is the factored form of x² - 9?</span><span class="vnumgf" aria-label="Required question">*</span></div></div></div>
      <div role="radiogroup" class="SG0AAe" aria-labelledby="i2">
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="A"></div><span dir="auto" class="aDTYNe">A) (x - 3)(x + 3)</span></label>
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="B"></div><span dir="auto" class="aDTYNe">B) (x - 9)(x + 1)</span></label>
        <label class="docssharedWizToggleLabeledContainer"><div class="Od2TWd" role="radio" aria-checked="false" aria-label="C"></div><span dir="auto" class="aDTYNe">C) (x - 3)²</span></label>
      </div>
    </div>
  </div>

  <div role="listitem" class="Qr7Oae card">
    <div jsmodel="CP1oW" data-params="%.@.[1000003,&quot;Name&quot;]">
      <div class="z12JJ"><div class="M4DNQ"><div role="heading" aria-level="3" class="HoXoMd D1wxyf RjsPE"><span class="M7eMe">What is your first name and class period?</span><span class="vnumgf" aria-label="Required question">*</span></div></div></div>
      <input class="short" type="text" aria-label="Your answer" placeholder="Your answer">
    </div>
  </div>

  <button class="submit" type="button">Submit</button>
</div>
</body>
</html>
