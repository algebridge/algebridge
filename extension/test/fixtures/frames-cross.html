<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course page with a quiz from another site</title>
<style>
  body { margin: 0; background: #fafafa; color: #222; font: 15px/1.5 "Helvetica Neue", Arial, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { margin: 0 0 16px; color: #555; }
  iframe { display: block; border: 1px solid #ddd; border-radius: 6px; background: #fff; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Week 6: Equations</h1>
  <p>The assignment below comes from the quiz site, a different origin from this course page.</p>
  <div id="slot"></div>
</div>
<script>
  // ?child=http://localhost:PORT/ puts both frames on that origin. The quiz
  // frame sits inside a web component's open shadow root, the way some
  // course sites embed tools; the ticker is a plain iframe.
  const child = new URLSearchParams(location.search).get("child") || "./";
  const slot = document.getElementById("slot");
  const frame = (id, file, w, h, title) => {
    const f = document.createElement("iframe");
    f.id = id;
    f.width = w;
    f.height = h;
    f.title = title;
    f.src = new URL(file, child).href;
    f.style.cssText = "display:block;border:1px solid #ddd;border-radius:6px;background:#fff;margin-bottom:16px";
    return f;
  };
  const embed = document.createElement("quiz-embed");
  embed.attachShadow({ mode: "open" }).appendChild(frame("big", "spa.html", 940, 460, "Assignment"));
  slot.appendChild(embed);
  slot.appendChild(frame("tiny", "tiny.html", 260, 150, "Ticker"));
</script>
</body>
</html>
