<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study notes (dark)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b1120; color: #cbd5e1; font: 16px/1.65 "Helvetica Neue", Arial, sans-serif; }
  .shell { max-width: 820px; margin: 0 auto; padding: 36px 28px 200px; }
  h1 { color: #f8fafc; font-size: 26px; margin: 0 0 6px; }
  .muted { color: #64748b; margin: 0 0 28px; font-size: 14px; }
  .q { background: #111a2e; border: 1px solid #1e293b; border-radius: 12px; padding: 18px 22px; margin-bottom: 16px; }
  .q .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: #38bdf8; margin-bottom: 6px; }
  .q .stem { color: #e2e8f0; font-size: 18px; }
  sup { font-size: 0.7em; }
  /* Page CSS that would break a less isolated widget. None of it may reach the hints UI. */
  html { font-size: 10px; }
  :root { --ab-blue: #ff00aa; --ab-ink: #00ff00; }
  algebridge-hints { display: none !important; opacity: 0.2 !important; transform: scale(0.5) !important; }
  .ab-card, .ab-panel, button { background: #ff00aa !important; font-size: 30px !important; }
  * { letter-spacing: 2px; }
</style>
</head>
<body>
<div class="shell">
  <h1>Night study: Chapter 4</h1>
  <p class="muted">Synced notes. Last edited 9:12 PM.</p>
  <div class="q"><div class="label">Warm up</div><div class="stem">Solve 3x + 5 = 20</div></div>
  <div class="q"><div class="label">Practice</div><div class="stem">Solve x<sup>2</sup> + 2x - 15 = 0 by factoring.</div></div>
  <div class="q"><div class="label">Notes</div><div class="stem">Remember: whatever you do to one side, do to the other side.</div></div>
</div>
</body>
</html>
