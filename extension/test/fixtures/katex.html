<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice: Solve one-step and two-step equations</title>
<style>
  /* A small subset of the KaTeX stylesheet, enough to lay out the markup below. */
  .katex { font: normal 1.21em "Times New Roman", Times, serif; line-height: 1.2; text-indent: 0; text-rendering: auto; }
  .katex * { border-color: currentColor; }
  .katex .katex-mathml { position: absolute; clip: rect(1px, 1px, 1px, 1px); padding: 0; border: 0; height: 1px; width: 1px; overflow: hidden; }
  .katex .katex-html > .newline { display: block; }
  .katex .base { position: relative; display: inline-block; white-space: nowrap; width: min-content; }
  .katex .strut { display: inline-block; }
  .katex .mathnormal { font-style: italic; }
  .katex .mord + .mbin, .katex .mbin + .mord { margin: 0 0.2222em; }
  .katex .mrel { margin: 0 0.2778em; }
  .katex .vlist-t { display: inline-table; table-layout: fixed; border-collapse: collapse; }
  .katex .vlist-r { display: table-row; }
  .katex .vlist { display: table-cell; vertical-align: bottom; position: relative; }
  .katex .vlist > span { display: block; height: 0; position: relative; }
  .katex .vlist > span > span { display: inline-block; }
  .katex .vlist > span > .pstrut { overflow: hidden; width: 0; }
  .katex .vlist-t2 { margin-right: -2px; }
  .katex .vlist-s { display: table-cell; vertical-align: bottom; font-size: 1px; width: 2px; min-width: 2px; }
  .katex .msupsub { text-align: left; }
  .katex .mfrac > span > span { text-align: center; }
  .katex .mfrac .frac-line { display: inline-block; width: 100%; border-bottom-style: solid; min-height: 1px; }
  .katex .nulldelimiter { display: inline-block; width: 0.12em; }
  .katex .sizing.reset-size6.size3, .katex .fontsize-ensurer.reset-size6.size3 { font-size: 0.7em; }
  .katex-display { display: block; margin: 1em 0; text-align: center; }
  .katex-display > .katex { display: block; text-align: center; white-space: nowrap; }
  .katex-display > .katex > .katex-html { display: block; position: relative; }

  body { margin: 0; background: #f7f8fa; color: #21242c; font: 16px/1.5 "Helvetica Neue", Arial, sans-serif; }
  .topbar { height: 56px; background: #0b2149; color: #fff; display: flex; align-items: center; padding: 0 24px; font-weight: 700; }
  .wrap { max-width: 720px; margin: 32px auto; padding: 0 24px 600px; }
  .exercise { background: #fff; border: 1px solid #d6d8da; border-radius: 8px; padding: 28px 32px; }
  .crumb { font-size: 14px; color: #5f6368; margin-bottom: 8px; }
  .paragraph { margin: 0 0 12px; }
  .answer-row { display: flex; gap: 10px; align-items: center; margin-top: 16px; }
  .answer-row input { font: inherit; padding: 8px 10px; border: 1px solid #babec2; border-radius: 4px; width: 160px; }
  .answer-row button { font: inherit; font-weight: 700; padding: 9px 18px; border: 0; border-radius: 4px; background: #1865f2; color: #fff; }
  .related { margin-top: 900px; background: #fff; border: 1px solid #d6d8da; border-radius: 8px; padding: 24px 32px; }
</style>
</head>
<body>
<div class="topbar">Practice</div>
<div class="wrap">
  <div class="crumb">Algebra 1 &gt; Solving equations &gt; Two-step equations</div>
  <div class="exercise">
    <div class="perseus-renderer">
      <div class="paragraph">Solve for <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.4306em;"></span><span class="mord mathnormal">x</span></span></span></span>.</div>
      <div class="paragraph"><span class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mfrac><mi>x</mi><mn>3</mn></mfrac><mo>+</mo><mn>2</mn><mo>=</mo><mn>7</mn></mrow><annotation encoding="application/x-tex">\frac{x}{3} + 2 = 7</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.7936em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.1076em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord">3</span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord mathnormal">x</span></span></span></span><span class="vlist-s">&#8203;</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mbin">+</span><span class="mord">2</span><span class="mrel">=</span><span class="mord">7</span></span></span></span></span></div>
    </div>
    <div class="answer-row">
      <input type="text" aria-label="Your answer" placeholder="Your answer">
      <button type="button">Check</button>
    </div>
  </div>

  <div class="related">
    <div class="paragraph">Related practice. Solve for <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi></mrow><annotation encoding="application/x-tex">x</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="mord mathnormal">x</span></span></span></span>:</div>
    <div class="paragraph"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>9</mn><mo>=</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">x^{2} - 9 = 0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="mord"><span class="mord mathnormal">x</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8141em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mbin">-</span><span class="mord">9</span><span class="mrel">=</span><span class="mord">0</span></span></span></span></div>
  </div>
</div>
</body>
</html>
