<section>
  <h2>Radical and logarithm review</h2>
  <p>Solve <math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msqrt><mrow><mi>x</mi><mo>+</mo><mn>7</mn></mrow></msqrt><mo>=</mo><mi>x</mi><mo>−</mo><mn>5</mn></mrow></math> and check for extraneous solutions.</p>
  <p>Evaluate <math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><msub><mi>log</mi><mn>2</mn></msub><mo>&#x2061;</mo><mn>32</mn></mrow></math>.</p>
  <p>Simplify <math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><mfrac><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>9</mn></mrow><mrow><mi>x</mi><mo>+</mo><mn>3</mn></mrow></mfrac></math></p>
  <p>Solve <math xmlns="http://www.w3.org/1998/Math/MathML"><mrow><mroot><mrow><mi>x</mi><mo>−</mo><mn>2</mn></mrow><mn>3</mn></mroot><mo>=</mo><mn>3</mn></mrow></math></p>
  <p>Simplify <math xmlns="http://www.w3.org/1998/Math/MathML"><mroot><mrow><mn>32</mn><msup><mi>x</mi><mn>5</mn></msup></mrow><mn>5</mn></mroot></math></p>
  <p>The answer key is on page 112.</p>
