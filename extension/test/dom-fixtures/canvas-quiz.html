    <div class="text">
      <div class="question_text user_content enhanced"><p>Solve the inequality.</p><p>−2x + 7 &lt; 15</p></div>
      <div class="answers"><fieldset><legend class="screenreader-only">Group of answer choices</legend>
        <div class="answer answer_for_ " id="answer_1"><label for="question_1001_answer_1" class="answer_label"><input type="radio" id="question_1001_answer_1" class="question_input" name="question_1001" value="1"><div class="answer_text">x &gt; −4</div></label></div>
        <div class="answer answer_for_ " id="answer_2"><label for="question_1001_answer_2" class="answer_label"><input type="radio" id="question_1001_answer_2" class="question_input" name="question_1001" value="2"><div class="answer_text">x &lt; −4</div></label></div>

    <div class="text">
      <div class="question_text user_content enhanced"><p>Factor completely: <img class="equation_image" title="x^{2}-16" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="LaTeX: x^{2}-16" data-equation-content="x^{2}-16" width="48" height="18"></p></div>

        <div class="answer" id="answer_3"><label class="answer_label"><input type="radio" class="question_input" name="question_1002" value="3"><div class="answer_text">(x − 4)(x + 4)</div></label></div>

    </div>
