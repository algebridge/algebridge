<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MathQuill, Wikipedia style and sup tags</title>
<style>
  .mq-math-mode .mq-selectable { position: absolute; left: -999em; top: -999em; }
  .mwe-math-mathml-a11y { clip: rect(1px, 1px, 1px, 1px); overflow: hidden; position: absolute; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div class="activity">
  <p class="prompt">Solve for x: <span class="mq-math-mode"><span class="mq-selectable">$\frac{x}{2}+5=11$</span><span class="mq-root-block"><span class="mq-fraction mq-non-leaf"><span class="mq-numerator"><var>x</var></span><span class="mq-denominator"><span>2</span></span></span><span class="mq-binary-operator">+</span><span>5</span><span class="mq-binary-operator">=</span><span>1</span><span>1</span></span></span></p>
  <p>Your answer: <span class="mq-editable-field mq-math-mode" aria-label="Math Input"><span class="mq-textarea"><textarea autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" x-palm-disable-ime-preview="true"></textarea></span><span class="mq-root-block mq-hasCursor"><var>x</var><span class="mq-binary-operator">=</span><span>1</span><span>2</span></span></span></p>
  <p>Solve <span class="mwe-math-element"><span class="mwe-math-mathml-inline mwe-math-mathml-a11y"><math xmlns="http://www.w3.org/1998/Math/MathML" alttext="{\displaystyle x^{2}+3x-10=0}"><semantics><mrow class="MJX-TeXAtom-ORD"><mstyle displaystyle="true" scriptlevel="0"><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>3</mn><mi>x</mi><mo>−</mo><mn>10</mn><mo>=</mo><mn>0</mn></mstyle></mrow><annotation encoding="application/x-tex">{\displaystyle x^{2}+3x-10=0}</annotation></semantics></math></span><img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" class="mwe-math-fallback-image-inline mw-invert skin-invert" aria-hidden="true" style="vertical-align: -0.505ex; width:17.6ex; height:2.843ex;" alt="{\displaystyle x^{2}+3x-10=0}"></span> by factoring.</p>
  <p>Simplify (2x<sup>3</sup>)<sup>2</sup> · x<sup>4</sup>.</p>
</div>
</body>
</html>
