<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sum Blocks · AlgeBridge Arcade</title>
<link rel="stylesheet" href="../kit/kit.css">
<style>
.sb-modes { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(6px, 1cqw, 12px); margin: 0 auto 0.5em; max-width: 30em; }
.sb-mode { font: inherit; cursor: pointer; background: #eff6ff; color: #1e3a8a; border: 3px solid #bfdbfe; border-bottom-width: 6px; border-radius: 16px; padding: 0.4em 0.4em 0.35em; display: flex; flex-direction: column; gap: 0.1em; }
.sb-mode b { font-weight: 900; font-size: clamp(14px, 2.1cqw, 22px); }
.sb-mode span { font-weight: 700; color: #64748b; font-size: clamp(10px, 1.35cqw, 14px); }
.sb-mode.on { background: #fde68a; border-color: #f59e0b; }
.sb-mode.on span { color: #78350f; }
.sb-next { margin: 0 0 0.3em; color: #fff; text-shadow: 0 2px 0 rgb(15 23 42 / 0.7); font-weight: 800; font-size: clamp(11px, 1.5cqw, 16px); }
.sb-link { font: inherit; font-weight: 800; color: #fde047; text-shadow: inherit; background: none; border: 0; padding: 0 0.2em; text-decoration: underline; cursor: pointer; }
.sb-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: clamp(4px, 0.8cqw, 10px); }
.sb-lv { font: inherit; cursor: pointer; background: #eff6ff; color: #1e3a8a; border: 3px solid #bfdbfe; border-bottom-width: 5px; border-radius: 14px; padding: 0.25em 0 0.2em; display: flex; flex-direction: column; align-items: center; }
.sb-lv b { font-weight: 900; font-size: clamp(13px, 2.2cqw, 24px); line-height: 1.15; }
.sb-lv.done { background: #d1fae5; border-color: #34d399; color: #065f46; }
.sb-lv:disabled { opacity: 0.4; cursor: default; }
.sb-lv:hover:not(:disabled) { transform: translateY(-1px); }
.sb-stars { display: flex; justify-content: center; }
.sb-stars svg { width: clamp(8px, 1.5cqw, 16px); height: auto; fill: #cbd5e1; }
.sb-stars svg.on { fill: #f59e0b; }
.sb-stars.sb-big svg { width: clamp(22px, 4cqw, 44px); stroke: #1e3a8a; stroke-width: 1.4; stroke-linejoin: round; }
.sb-tip { margin: 0.6em 0 0; min-height: 1.3em; color: #334155; font-weight: 700; font-size: clamp(11px, 1.5cqw, 16px); }
.sb-portrait .ak-card, .sb-portrait .ak-card.ak-small, .sb-portrait .ak-card.ak-wide { width: 90%; }
.sb-portrait .ak-card.ak-small { width: 78%; }
.sb-portrait .sb-grid { grid-template-columns: repeat(5, 1fr); gap: 1.6cqw; }
.sb-portrait .sb-lv b { font-size: 5cqw; }
.sb-portrait .sb-stars svg { width: 3.4cqw; }
.sb-portrait .sb-stars.sb-big svg { width: 9cqw; }
.sb-portrait .sb-mode b { font-size: 4.4cqw; }
.sb-portrait .sb-mode span, .sb-portrait .sb-next, .sb-portrait .sb-tip { font-size: 3cqw; }
.sb-portrait .ak-toasts { padding-top: 40cqw; }
.sb-portrait .ak-toast { font-size: 3.6cqw; padding: 1.2cqw 3.4cqw; max-width: 86%; text-align: center; border-radius: 4cqw; }
.sb-portrait .ak-card h1 { font-size: 8cqw; }
.sb-portrait .ak-card h2 { font-size: 6.4cqw; }
.sb-portrait .ak-tag, .sb-portrait .ak-how, .sb-portrait .ak-line, .sb-portrait .ak-best { font-size: 3.2cqw; }
.sb-portrait .ak-controls { font-size: 2.9cqw; }
.sb-portrait .ak-btn { font-size: 4.6cqw; }
.sb-portrait .ak-btn.ak-ghost { font-size: 3.4cqw; }
.sb-portrait .ak-score b { font-size: 11cqw; }
.sb-portrait .ak-score span { font-size: 3cqw; }
.sb-portrait .ak-archie { height: 15cqw; }
@container (max-width: 560px) {
  .ak-stage:not(.sb-portrait) .ak-menu .ak-how, .ak-stage:not(.sb-portrait) .ak-menu .ak-controls { display: none; }
  .ak-stage:not(.sb-portrait) .ak-menu .ak-archie { display: none; }
  .ak-stage:not(.sb-portrait) .ak-menu .ak-tag { display: none; }
  .ak-stage:not(.sb-portrait) .ak-menu h1 { margin: 0 0 0.25em; }
  .ak-stage:not(.sb-portrait) .ak-menu .ak-best { display: none; }
  .ak-stage:not(.sb-portrait) .ak-menu { padding: 10px 14px; width: 70%; }
  .ak-stage:not(.sb-portrait) .sb-mode { padding: 0.2em; border-radius: 12px; border-bottom-width: 4px; }
  .ak-stage:not(.sb-portrait) .sb-next { display: none; }
  .ak-stage:not(.sb-portrait) .ak-card.sb-levels { padding: 8px 12px; }
  .ak-stage:not(.sb-portrait) .sb-levels .ak-tag, .ak-stage:not(.sb-portrait) .sb-levels .sb-tip { display: none; }
  .ak-stage:not(.sb-portrait) .sb-lv { border-width: 2px; border-bottom-width: 3px; border-radius: 9px; padding: 0.1em 0; }
}
</style>
</head>
<body>
<div id="game"></div>
<script type="module" src="./game.js"></script>
</body>
</html>
